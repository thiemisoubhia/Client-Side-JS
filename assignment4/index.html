<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Explorer</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
</head>
<body>

    <header class="top">
        <h1>Music Explorer</h1>
        <p>Discover the most popular tracks and musical styles of your favourite artists.</p>
    </header>

        <!-- Form -->
        <form id="search">

            <input
                type="text"
                id="artistName"
                placeholder="Enter an artist name..."
                required
            >

            <button type="submit">
                Search
            </button>

        </form>


         <main>

        <!-- Artist -->
        <section id="artist"></section>

    </main>

    
    <footer>

        <div class="infos">
        <!-- My informations -->
        <p id="name"></p>

        <p id="studentID"></p>
        </div>

        <p> Data provided by <a href="https://www.last.fm/api/intro"> Last.fm API Documentation </a> </p>

    </footer>
   
        <!-- API DOCUMENTATION -->
        <!-- https://www.last.fm/api/intro -->
</body>
</html>

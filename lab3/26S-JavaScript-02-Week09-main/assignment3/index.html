<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Pizza Order</title>
</head>

<body>

    <h1>Pizza Order Form</h1>

    <p id="infos"></p>

    <form id="pizzaForm">

        <div class="container">

            <!-- Customer Information -->
            <div class="section">

                <h2>Customer Information</h2>

                <label for="customerName">Full Name:</label>
                <input type="text" id="customerName" required> <br>

                <label for="email">Email:</label>
                <input type="email" id="email" required> <br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" required> <br>

                <label for="address">Delivery Address:</label><br>
                <textarea id="address" rows="6" cols="36" required></textarea>

            </div>

            <div class="section">

                <h2>Pizza Order</h2>

                <label for="pizzaSize">Pizza Size:</label><br>
                <select id="pizzaSize" required>
                    <option value="">Choose a size</option>
                    <option value="Small">Small</option>
                    <option value="Medium">Medium</option>
                    <option value="Large">Large</option>
                </select>

                <br>

                <label>Crust:</label>

                <div class="row">
                    <label><input type="radio" name="crust" value="Thin" required> Thin</label>

                    <label><input type="radio" name="crust" value="Regular"> Regular</label>

                    <label><input type="radio" name="crust" value="Stuffed"> Stuffed</label>
                </div>

                <br>

                <label>Toppings:</label>

                <div class="row">
                    <label><input type="checkbox" value="Pepperoni" name="Pepperoni"> Pepperoni</label>

                    <label><input type="checkbox" value="Mushrooms" name="Mushrooms"> Mushrooms</label>

                    <label><input type="checkbox" value="Onions" name="Onions"> Onions</label>

                    <label><input type="checkbox" value="Bacon" name="Bacon"> Bacon</label>

                    <label><input type="checkbox" value="Extra Cheese" value="Extra Cheese"> Extra Cheese</label>
                </div>

                <br><br>

                <label>Special Instructions:</label><br>
                <textarea id="instructions" rows="6" cols="36"></textarea>

            </div>

        </div>

        <button type="submit">Place Order</button>

    </form>

    <script src="js/assignment.js"></script>

</body>

</html>

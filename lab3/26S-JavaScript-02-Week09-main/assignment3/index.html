<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Pizza Order</title>
</head>
<body>

    <h1>Pizza Order Form</h1>

    <p id="infos"></p>

    <form id="pizzaForm">

        <label for="customerName">Customer Name:</label><br>
        <input type="text" id="customerName" required><br><br>

        <label for="pizzaSize">Pizza Size:</label><br>
        <select id="pizzaSize" required>
            <option value="">Choose a size</option>
            <option value="Small">Small</option>
            <option value="Medium">Medium</option>
            <option value="Large">Large</option>
        </select>
        
        <br><br>

        <label>Crust:</label><br>
        <input type="radio" name="crust" value="Thin" required> Thin
        <input type="radio" name="crust" value="Regular"> Regular
        <input type="radio" name="crust" value="Stuffed"> Stuffed
        <br><br>

        <label>Toppings:</label><br>
        <input type="checkbox" value="Pepperoni"> Pepperoni<br>
        <input type="checkbox" value="Mushrooms"> Mushrooms<br>
        <input type="checkbox" value="Onions"> Onions<br>
        <input type="checkbox" value="Bacon"> Bacon<br>
        <input type="checkbox" value="Extra Cheese"> Extra Cheese<br><br>

        <label for="instructions">Special Instructions:</label><br>
        <textarea id="instructions" rows="4"></textarea>
        
        <br><br>

        <button type="submit">Place Order</button>

    </form>

    <script src="js/assignment.js"></script>

</body>
</html>

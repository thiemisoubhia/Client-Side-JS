<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Silly Character Customizer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="js/sillyCharacter.js" defer></script>
    
    <!-- css -->
    <link rel="stylesheet" href="css/style.css">

    <!-- google font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container py-5">

        <div class="card shadow p-4 mx-auto text-center" style="max-width: 600px;">

            <h1 class="mb-3">Silly Character Customizer</h1>

            <h2 class="h5 text-muted mb-4">Start by choosing a name</h2>

            <label for="nameInput" class="form-label">Character Name</label>
            <input type="text" class="form-control mb-4" id="nameInput" placeholder="Enter a funny name" required>

            <p id="characterDescription" class="lead"></p>

            <div class="d-flex justify-content-center gap-2 mt-3 flex-wrap">
                <button class="btn btn-dark" id="generateButton">Generate</button>
                <button class="btn btn-success" id="increaseAgeButton">Increase Age</button>
                <button class="btn btn-danger" id="decreaseAgeButton">Decrease Age</button>
            </div>

        </div>

    </div>

</body>

</html>
